:root { --paper: #ffffff; --white: #f8f7f3; --black: #111111; --red: #d8261d; --blue: #1c4ea1; --yellow: #f4c522;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--black); }
body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.top { width: min(100%, 34rem); display: grid; gap: 1.6rem; justify-items: start; }
.mark { display: grid; grid-template-columns: 3fr 2fr 1fr; grid-template-rows: 3fr 2fr; gap: 6px; width: 100%; aspect-ratio: 16 / 9; background: var(--black); border: 6px solid var(--black); }
.mark i:nth-child(1) { background: var(--red); grid-row: span 2; }
.mark i:nth-child(2) { background: var(--blue); }
.mark i:nth-child(3), .mark i:nth-child(4) { background: var(--white); }
.mark i:nth-child(5) { background: var(--yellow); }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 11vw, 4.2rem); line-height: 1.08; }
.btn { font-family: var(--display); text-decoration: none; font-size: 1.15rem; padding: .85rem 1.5rem; border: 5px solid var(--black); background: var(--red); color: var(--paper); }
.btn:hover { filter: brightness(1.1); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
</style>
</head>
