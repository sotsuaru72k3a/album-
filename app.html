<title>卒アル・コンポジション</title>
<style>
:root { --paper: #ffffff; --black: #111111; --red: #d8261d; --blue: #1c4ea1; --yellow: #f4c522; --white: #f8f7f3; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--black); }
body { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.box { width: min(100%, 24rem); display: grid; gap: 1.2rem; }
.art { display: grid; grid-template-columns: 3fr 2fr 1fr; grid-template-rows: 3fr 2fr; gap: 6px; aspect-ratio: 16 / 9; background: var(--black); border: 6px solid var(--black); }
.art i:nth-child(1) { background: var(--red); grid-row: span 2; }
.art i:nth-child(2) { background: var(--blue); }
.art i:nth-child(3) { background: var(--white); }
.art i:nth-child(4) { background: var(--white); }
.art i:nth-child(5) { background: var(--yellow); }
h1 { margin: 0; font-size: 1.6rem; font-weight: 900; line-height: 1.2; }
form { display: grid; gap: .6rem; }
label { font-weight: 700; font-size: .9rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; }
input { font: inherit; font-size: 1.2rem; padding: .55rem .7rem; border: 4px solid var(--black); border-radius: 0; min-width: 0; letter-spacing: .1em; }
button { font: inherit; font-weight: 800; padding: .55rem 1.1rem; border: 4px solid var(--black); background: var(--red); color: var(--paper); cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
#msg { margin: 0; min-height: 1.5em; font-weight: 700; font-size: .9rem; }
#msg.err { color: var(--red); }
.back { margin: 0; font-size: .9rem; font-weight: 700; }
.back a { color: var(--black); }
.ns { margin: 0; padding: .8rem 1rem; border: 4px solid var(--black); background: var(--yellow); font-weight: 700; line-height: 1.6; }
</style>
</head>
